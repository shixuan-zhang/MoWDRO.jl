[experiment]
"training sample sweeps"  = [{ start = 10, stop = 100, step = 10 }]
"testing sample size"      = 10000
"target optimality gap"    = 1.0e-4
"Wasserstein dual min"     = 0.0
"Wasserstein dual max"     = 1.0e6
"loss lower bound"         = 0.0
"maximum cut coefficient"  = 1.0e5
"baseline method"          = "noncvx"
"time limit"               = 600
"nonconvex baseline bound" = 100       # positive value tightens Ξ in the nonconvex baseline
"radius scaling"           = 2
"random seed"             = "none"  # allowed: integer (e.g. 42) | "none" for fresh random seeding
"number of replications"   = 1
"Wasserstein order"        = 2
"Wasserstein radii"        = [0.0, 1e-2, 2e-2, 5e-2, 1e-1]

[problem]
"number of variables"      = 10
"truth polynomial degree"  = 2
"noise standard deviation" = 0.1
"support set"              = "orthant"  # options: "full-space", "orthant", or "box"
"probability for sparsity" = 0.2
"regression type"          = "quantile" # options: "mean" (squared loss) or "quantile" (pinball loss)
"quantile level"           = 0.5        # τ ∈ (0,1); used only when "regression type" = "quantile"
