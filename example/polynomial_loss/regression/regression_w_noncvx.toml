[experiment]
"training sample sizes"   = [5]
"testing sample size"     = 10000
"target optimality gap"   = 1.0e-4
"Wasserstein dual min"    = 0.0
"Wasserstein dual max"    = 1.0e6
"loss lower bound"        = 0.0
"maximum cut coefficient" = 1.0e4
"baseline method"         = "noncvx"
"radius scaling"          = 0
"number of replications"  = 1
"Wasserstein order"       = 2
"Wasserstein radii"       = [0.0, 2.0e-2, 1.0e-1]

[problem]
"number of variables"      = 3
"truth polynomial degree"  = 2
"noise standard deviation" = 0.1
"support set"              = "orthant"  # options: "full-space", "orthant", or "box"
"probability for sparsity" = 0.2
"regression type"          = "qunatile" # options: "mean" (squared loss) or "quantile" (pinball loss)
"quantile level"           = 0.5        # τ ∈ (0,1); used only when "regression type" = "quantile"
