[experiment]
"training sample sweeps"  = [{ start = 10, stop = 100, step = 10 }]
"testing sample size"     = 10000
"target optimality gap"   = 1.0e-4
"Wasserstein dual min"    = 0.0
"Wasserstein dual max"    = 1.0e6
"loss lower bound"        = 0.0
"maximum cut coefficient" = 1.0e4
"baseline method"         = "none"
"radius scaling"          = 2 
"random seed"             = "none"  # allowed: integer (e.g. 42) | "none" for fresh random seeding
"number of replications"  = 10
"Wasserstein order"       = 4
"Wasserstein radii"       = [0.0, 2.5e-2, 5.0e-2, 7.5e-2, 1.0e-1]

[problem]
"number of variables"      = 5
"truth polynomial degree"  = 2
"noise standard deviation" = 0.1
"support set"              = "orthant"  # options: "full-space", "orthant", or "box"
"probability for sparsity" = 0.2
"CVaR level"               = 0.1        # β ∈ (0,1); paper (5.9) convention (β→0 = worst-tail)
"tau lower bound"          = 0.0        # lower bound on the CVaR auxiliary decision τ
"tau upper bound"          = 100.0      # upper bound on the CVaR auxiliary decision τ
